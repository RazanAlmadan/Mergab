
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>غير مصرح بالدخول | مِرقاب</title>
  <link rel="icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    .forbidden-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8f7f3;
      text-align: center;
    }
    .forbidden-card {
      background: white;
      border: 1px solid #e2e8e2;
      border-radius: 20px;
      padding: 45px 30px;
      max-width: 480px;
      width: 100%;
    }
    .forbidden-card h1 {
      color: #0e3d32;
      margin: 15px 0;
    }
    .forbidden-card p {
      color: #64776e;
      margin-bottom: 25px;
    }
    .forbidden-card a {
      display: inline-block;
      padding: 12px 20px;
      margin: 5px;
      border-radius: 10px;
      background: #0e5946;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
<main class="forbidden-page">
  <div class="forbidden-card">
    <img src="/img/logo.png" alt="مِرقاب" width="160">
    <h1>403 — غير مصرح بالدخول</h1>
    <p>ليس لديك صلاحية للوصول إلى هذه الصفحة.</p>
    <a href="/">الرئيسية</a>
    <a href="/login">تسجيل الدخول</a>
  </div>
</main>
</body>
</html>
