
<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الفعاليات | مِرقاب</title>

  <link rel="icon" href="/img/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&display=block" rel="stylesheet">

  <!-- Shared styles -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/mergab.css">
  <link rel="stylesheet" href="/css/visitor-refresh.css">

  <!-- Page styles -->
  <link rel="stylesheet" href="/css/visitor-events.css">

  <!-- JavaScript -->
  <script defer src="/js/base.js"></script>
  <script defer src="/js/event-images.js"></script>
  <script defer src="/js/visitor-events.js"></script>
</head>

<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="ve-page">

  <div class="ve-heading">
    <h1 id="eventsTitle">فعاليات إكسبو</h1>
    <p id="eventsDescription">
      اكتشف الفعاليات القادمة واختر وجهتك داخل المعرض.
    </p>
  </div>

  <div class="ve-toolbar">
    <input
            id="eventSearch"
            type="search"
            placeholder="ابحث عن فعالية أو منطقة..."
            aria-label="البحث عن فعالية">

    <select id="zoneFilter" aria-label="تصفية حسب المنطقة">
      <option value="all">جميع المناطق</option>
    </select>
  </div>

  <div class="ve-filters" id="timeFilters">
    <button type="button" data-when="upcoming" class="active">
      القادمة
    </button>

    <button type="button" data-when="today">
      اليوم
    </button>

    <button type="button" data-when="tomorrow">
      بكرة
    </button>

    <button type="button" data-when="all">
      الكل
    </button>
  </div>

  <div
          id="eventsGrid"
          class="ve-grid"
          aria-live="polite">
  </div>

  <div
          id="eventsMessage"
          class="ve-empty"
          role="status">
    جاري تحميل الفعاليات...
  </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
